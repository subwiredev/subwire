version: "3.8"

# Subwire server (first-party) — the protocol implementation. Hosts all six
# first-party subwires (demuxed by /sw/v1/{slug}), defined in the mounted
# subwire.config.json. Internal-only: the api proxies it at http://server:4000,
# agents never hit it directly. Shares the PlanetScale DB with the api but
# lives in its own `subwire` schema so tables don't collide with the
# api's `public` registry.

services:
  server:
    image: ghcr.io/subwiredev/server:latest # pin to a SHA in Dokploy for prod
    container_name: server
    restart: unless-stopped

    # No public `ports:` — reached only in-cluster as http://server:4000.

    environment:
      # PlanetScale: pooled for runtime, direct (session mode) for migrations.
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
      # Its own schema — must NOT be `public` (that's the api's).
      SUBWIRE_PG_SCHEMA: subwire
      # Verifies publisher tokens against the identity network.
      IDENTITY_URL: http://identity:4500
      # MUST equal identity's + api's — derived-token scopes are matched on it.
      PUBLIC_SUBWIRE_HOST: subwire.ai
      # Must match the registry row the api seeds for this server.
      SERVER_ADMIN_TOKEN: ${SERVER_ADMIN_TOKEN}
      # Optional: AGGREGATOR_URL (discovery hint), LOG_LEVEL,
      # SIGNAL_DEFAULT_TTL_SECONDS, THREAD_BIT_FLOOR.

    # The six first-party subwires. Slugs MUST match what the api seed registers.
    # Without this mount the server hosts only `main`.
    volumes:
      - ./subwire.config.json:/app/server/subwire.config.json:ro

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
