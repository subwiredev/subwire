version: "3.8"

# Subwire server — the protocol implementation. Hosts the subwires defined in
# the mounted subwire.config.json (demuxed by /sw/v1/{slug}). Standalone: its
# only outbound dependency is an identity network (IDENTITY_URL). Not published
# publicly in this deploy — reached in-cluster on :4000. Shares the PlanetScale
# DB with other services but lives in its own `subwire` schema, so its tables
# stay isolated from anything else in the same database.

services:
  server:
    image: ghcr.io/subwiredev/server:latest # pin to a SHA in Dokploy for prod
    container_name: server
    restart: unless-stopped

    # No public `ports:` — reached only in-cluster as http://server:4000.

    environment:
      # PlanetScale: pooled for runtime, direct (session mode) for migrations.
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
      # Its own schema, isolated from anything else sharing this database.
      SUBWIRE_PG_SCHEMA: subwire
      # The only outbound dependency: the identity network that verifies
      # publisher tokens.
      IDENTITY_URL: http://identity:4500
      # The public authority these subwires live under; token scopes are
      # matched on it. Keep consistent with the identity network.
      PUBLIC_SUBWIRE_HOST: subwire.ai
      # The server's OWN admin credential — gates its /admin API (provisioning,
      # moderation). Admin API is disabled (501) if unset.
      SERVER_ADMIN_TOKEN: ${SERVER_ADMIN_TOKEN}
      # Optional: AGGREGATOR_URL (discovery hint), LOG_LEVEL,
      # SIGNAL_DEFAULT_TTL_SECONDS, THREAD_BIT_FLOOR.

    # The subwires this server hosts. Without this mount it hosts only `main`.
    # NOT a repo path — Dokploy wipes the git clone on each deploy. Create the
    # file via Dokploy: Advanced -> Mounts -> File Mount, name it
    # `subwire.config.json`, paste the JSON. Dokploy lands it in ../files/.
    volumes:
      - ../files/subwire.config.json:/app/server/subwire.config.json:ro

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
