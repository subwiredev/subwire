name: Build server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", "protocol/**", ".github/workflows/build-image.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built from the repo root so the Bun workspace (protocol + server) is in
      # context. One image runs any subwire set: subwires come from a mounted
      # subwire.config.json, the rest from runtime env.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/subwiredev/server:${{ github.sha }}
            ghcr.io/subwiredev/server:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
