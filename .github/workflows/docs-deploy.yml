name: Deploy docs to Cloudflare

# Builds the Starlight site (docs/) and deploys it to Cloudflare Workers as
# static assets. Static-asset requests are free, so this needs no paid plan.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID
# The Worker (subwire-docs) is created automatically on the first deploy.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
