name: protocol CI

on:
  push:
    branches: [main]
    paths: ["protocol/**", ".github/workflows/protocol-ci.yml"]
  pull_request:
    paths: ["protocol/**", ".github/workflows/protocol-ci.yml"]

defaults:
  run:
    working-directory: protocol

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
