name: server CI

on:
  push:
    branches: [main]
    paths: ["server/**", "protocol/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", "protocol/**", ".github/workflows/server-ci.yml"]

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subwire
          POSTGRES_PASSWORD: subwire
          POSTGRES_DB: subwire_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U subwire"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
